# ACOS WP7 spike S-GH: canary workflow (B7, T8.1).
#
# Committed to the synthetic test repo as .github/workflows/acos-canary.yml.
# Prints only SHA-256 digests, never a secret. An unavailable secret expands to the empty string,
# whose digest is e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855.
# Trigger: pull_request (never pull_request_target). The head branch is selected in each job's if:
# because pull_request's branches: filter matches the BASE branch (P-422).
name: acos-canary

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  canary:
    if: startsWith(github.head_ref, 'acos/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print canary digests (never the values)
        env:
          CANARY: ${{ secrets.ACOS_CANARY }}
          CONTROL: ${{ secrets.ACOS_CANARY_CONTROL }}
        run: |
          printf 'ACOS_CANARY_SHA256=%s\n' "$(printf '%s' "$CANARY" | sha256sum | cut -d' ' -f1)"
          printf 'ACOS_CANARY_CONTROL_SHA256=%s\n' "$(printf '%s' "$CONTROL" | sha256sum | cut -d' ' -f1)"

  canary-env:
    if: startsWith(github.head_ref, 'acos/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: acos-canary
    steps:
      - name: Print canary digest from the protected environment (must never run on acos/*)
        env:
          CANARY: ${{ secrets.ACOS_CANARY }}
        run: |
          printf 'ACOS_CANARY_ENV_SHA256=%s\n' "$(printf '%s' "$CANARY" | sha256sum | cut -d' ' -f1)"
